[package]
name = "my-home-client-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros"] }
thiserror = "2.0.19"
anyhow = "1.0.104"
serde = {version =  "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
axum-extra = { version = "0.12.6", features = ["query"] }
tower-http = { version = "0.7.0", features = ["cors"] }
furniture = {path = "../furniture"}